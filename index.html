<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BnF Hebrew manuscript — transcription overlay</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/openseadragon/4.1.0/openseadragon.min.js"></script>
<style>
  :root{
    /* The palette of the MiDRASH Core system brief: warm paper, olive accent,
       and the brownish greys of a printed page. */
    --bg:#faf8f3;          /* paper */
    --panel:#f4f1e9;       /* toolbars, sidebar */
    --panel-2:#eae5d8;     /* hover, pressed */
    --rule:#c9c2b4;        /* rules and borders */
    --rule-soft:#ddd8cc;   /* lighter separators */
    --ink:#1c1a17;         /* text */
    --muted:#5b5449;       /* labels, counts */
    --hl:#6a7a52;          /* olive accent */
    --hl-soft:#e8ecdd;     /* accent background */
    --rubric:#8c3a2b;      /* warnings, low confidence */
    --ok:#4a6b3f;
    --stage:#2b2823;       /* behind the manuscript image */
    --mono: "Courier New", ui-monospace, Menlo, Consolas, monospace;
    --sans: Georgia, "Times New Roman", serif;
    --hebrew: "Frank Ruhl Libre", "David Libre", "Times New Roman", "Noto Serif Hebrew", serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg);color:var(--ink);font-family:var(--sans);
    display:flex;flex-direction:column;overflow:hidden;
  }

  /* ---------- chrome ---------- */
  header{
    display:flex;align-items:center;gap:18px;flex-wrap:wrap;
    padding:9px 14px 10px;background:var(--panel);border-bottom:1px solid var(--rule);
    font-size:12px;
  }
  .brand b{color:var(--ink);font-weight:bold}
  .brand{font-family:var(--sans);font-size:12px;letter-spacing:.06em;color:var(--muted)}
  .brand b{color:var(--ink);font-weight:600}
  .grp{display:flex;align-items:center;gap:7px}
  label{color:var(--muted);font-size:11px;white-space:nowrap}
  input[type=text],input[type=number]{
    background:#fff;border:1px solid var(--rule);color:var(--ink);
    font-family:var(--mono);font-size:12px;padding:4px 7px;border-radius:2px;
  }
  input[type=text]{width:150px}
  input[type=number]{width:62px}
  input:focus-visible,button:focus-visible,select:focus-visible{outline:2px solid var(--hl);outline-offset:1px}
  button{
    background:#fff;border:1px solid var(--rule);color:var(--ink);
    font-family:var(--sans);font-size:12px;padding:5px 10px;border-radius:2px;cursor:pointer;
  }
  button:hover{border-color:var(--hl);color:var(--hl)}
  button[aria-pressed=true]{background:var(--hl);border-color:var(--hl);color:#fff;font-weight:600}
  .seg{display:flex;border:1px solid var(--rule);border-radius:2px;overflow:hidden}
  .seg button{border:0;border-radius:0;padding:5px 12px}
  .seg button + button{border-left:1px solid var(--rule)}

  /* ---------- the collation slider (signature control) ---------- */
  .searchrow{
    display:flex;align-items:center;gap:10px;width:100%;order:99;
    padding-top:2px;
  }
  #topq{
    flex:1;background:#fff;border:1px solid var(--rule);color:var(--ink);
    font-family:var(--sans);font-size:13.5px;padding:7px 12px;border-radius:3px;
  }
  #topq:focus{border-color:var(--hl);outline:none;box-shadow:0 0 0 2px var(--hl-soft)}
  #topcount{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap}

  .collate{display:flex;align-items:center;gap:9px;padding:3px 12px;background:var(--panel-2);border:1px solid var(--rule);border-radius:3px}
  .collate .cap{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.08em}
  #opacity{width:190px;accent-color:var(--hl)}
  #opVal{font-family:var(--mono);font-size:11px;color:var(--hl);width:30px;text-align:right}
  .blink{font-family:var(--mono);font-size:10px;color:var(--muted);border-left:1px solid var(--rule);padding-left:10px}
  .blink kbd{background:#fff;border:1px solid var(--rule);border-radius:2px;padding:1px 5px;color:var(--ink);font-family:var(--mono)}

  /* ---------- stage ---------- */
  main{flex:1;display:flex;min-height:0;position:relative}
  #osd{flex:1;min-width:0;background:var(--stage)}
  #osd.ghost .openseadragon-canvas{opacity:.18;transition:opacity .08s linear}

  /* facing text column */
  #facing{
    width:0;flex:0 0 0;overflow-y:auto;background:var(--panel);
    border-left:1px solid var(--rule);transition:flex-basis .18s ease, width .18s ease;
  }
  body.mode-facing #facing{width:38%;flex:0 0 38%}
  .fline{
    display:flex;gap:10px;align-items:flex-start;
    padding:6px 14px;border-bottom:1px solid var(--rule-soft);cursor:default;
  }
  .fline:hover,.fline.hot{background:var(--hl-soft)}
  .fline .n{font-family:var(--mono);font-size:10px;color:var(--muted);padding-top:5px;min-width:22px;text-align:right}
  .fline .t{
    flex:1;direction:rtl;text-align:right;font-family:var(--hebrew);
    font-size:17px;line-height:1.5;
    /* One manuscript line per row: wrapping would break the correspondence
       between the numbers here and the lines on the page. */
    white-space:nowrap;overflow-x:auto;overflow-y:hidden;
    scrollbar-width:thin;
  }
  .fline .t::-webkit-scrollbar{height:5px}
  .fline .t::-webkit-scrollbar-thumb{background:var(--rule);border-radius:3px}
  .fline.low .n{color:var(--rubric);font-weight:600}

  /* ---------- overlay lines on the image ---------- */
  .oline{
    direction:rtl;text-align:right;font-family:var(--hebrew);
    color:#15100a;white-space:nowrap;overflow:visible;
    /* Dark ink on a light halo: legible over parchment, and it reads as
       writing rather than as a caption floating above the page. */
    text-shadow:0 0 2px #fff, 0 0 5px #fff, 0 0 9px rgba(255,255,255,.85);
    display:flex;align-items:center;justify-content:flex-end;
    pointer-events:auto;cursor:default;
  }
  body.inklight .oline{
    color:#fbf7ee;
    text-shadow:0 0 2px #000, 0 0 6px #000, 0 0 10px rgba(0,0,0,.8);
  }
  .oline > span{display:inline-block;transform-origin:100% 50%;white-space:nowrap}
  body.boxes .oline{outline:1px solid rgba(123,143,212,.55)}
  .oline.hot{outline:1px solid var(--hl);background:rgba(123,143,212,.14)}
  .oline.low{color:#7a1a12;text-shadow:0 0 2px #fff,0 0 6px #fff,0 0 10px rgba(255,220,215,.9)}
  body.inklight .oline.low{color:#ffd9d4;text-shadow:0 0 3px #000,0 0 8px #7a1a12}

  /* ---------- footer / status ---------- */
  footer{
    display:flex;align-items:center;gap:16px;flex-wrap:wrap;
    padding:6px 14px;background:var(--panel);border-top:1px solid var(--rule);
    font-family:var(--mono);font-size:11px;color:var(--muted);
  }
  footer .k{color:var(--ink)}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block;margin-right:6px}
  .dot.ok{background:var(--ok)} .dot.bad{background:var(--rubric)}

  /* ---------- error / empty states ---------- */
  #notice{
    position:absolute;inset:auto 0 0 0;margin:0 auto 22px;max-width:560px;
    background:#fff;border:1px solid var(--rubric);border-radius:3px;
    box-shadow:0 2px 14px rgba(40,32,20,.16);
    padding:12px 14px;font-size:12.5px;line-height:1.5;display:none;z-index:40;
  }
  #notice.show{display:block}
  #notice h4{margin:0 0 5px;font-size:12px;font-family:var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--rubric)}
  #notice button{margin-top:9px}

  .drop{border:1px dashed var(--rule);border-radius:2px;padding:4px 9px;color:var(--muted);font-size:11px;cursor:pointer}
  .drop:hover{border-color:var(--hl);color:var(--ink)}
  .drop.armed{border-color:var(--ok);color:var(--ok)}
  input[type=file]{display:none}


  /* ---------- browse panel ---------- */
  #browse{
    position:absolute;inset:0;z-index:60;background:var(--bg);
    display:none;grid-template-columns:250px 1fr;overflow:hidden;
  }
  body.browsing #browse{display:grid}
  #facets{
    border-right:1px solid var(--rule);overflow-y:auto;padding:14px 12px;
    background:var(--panel);
  }
  #facets h4{
    margin:14px 0 6px;font-family:var(--mono);font-size:10px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--muted);font-weight:600;
  }
  #facets h4:first-child{margin-top:0}
  .fv{
    display:flex;justify-content:space-between;gap:8px;padding:3px 6px;
    border-radius:2px;cursor:pointer;font-size:12.5px;color:var(--ink);
  }
  .fv:hover{background:var(--panel-2)}
  .fv.on{background:var(--hl);color:#fff;font-weight:600}
  .fv .c{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
  .fv.on .c{color:#dde5cf}
  #results{overflow-y:auto;padding:0 0 30px}
  .rhead{
    position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--rule);
    padding:12px 18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;z-index:2;
  }
  #q{
    flex:1;min-width:200px;background:#fff;border:1px solid var(--rule);
    color:var(--ink);font-size:14px;padding:8px 12px;border-radius:3px;
  }
  #rcount{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap}
  .ms{
    display:grid;grid-template-columns:110px 1fr auto;gap:16px;align-items:baseline;
    padding:11px 18px;border-bottom:1px solid var(--rule-soft);cursor:pointer;
  }
  .ms:hover{background:var(--hl-soft)}
  .ms .sh{font-family:var(--mono);font-size:12px;color:var(--hl);font-weight:600}
  .ms .ti{font-family:var(--hebrew);font-size:17px;direction:rtl;text-align:right}
  .ms .lat{font-size:13px;color:var(--ink)}
  .ms .meta{font-family:var(--mono);font-size:10.5px;color:var(--muted);text-align:right;white-space:nowrap}
  .ms .tags{margin-top:3px;font-size:11px;color:var(--muted)}
  .empty{padding:40px 18px;color:var(--muted);font-size:13px}

  ::-webkit-scrollbar{width:11px;height:11px}
  ::-webkit-scrollbar-track{background:var(--bg)}
  ::-webkit-scrollbar-thumb{background:#c9c2b4;border-radius:6px;border:3px solid var(--bg)}
  ::-webkit-scrollbar-thumb:hover{background:#a89f8c}

  @media (prefers-reduced-motion: reduce){ *{transition:none !important} }
  @media (max-width:820px){
    body.mode-facing main{flex-direction:column}
    body.mode-facing #facing{width:100%;flex:0 0 45%;border-left:0;border-top:1px solid var(--rule)}
    #opacity{width:120px}
  }
</style>
</head>
<body class="mode-overlay">

<header>
  <div class="brand"><b>MiDRASH</b> · BnF Hébreu · automatic transcription</div>

  <div class="grp">
    <button id="browseBtn">Browse manuscripts</button>
    <label class="drop" id="folderLabel" for="folder">Open transcription folder</label>
    <input id="folder" type="file" webkitdirectory directory multiple>
    <select id="pagesel" aria-label="Page"><option>— no folder loaded —</option></select>
    <button id="prev" title="Previous page">‹</button>
    <button id="next" title="Next page">›</button>
  </div>

  <div class="seg" role="group" aria-label="Display mode">
    <button id="mOverlay" aria-pressed="true">Overlay</button>
    <button id="mFacing" aria-pressed="false">Facing</button>
  </div>

  <div class="searchrow">
    <input id="topq" type="text" spellcheck="false"
           placeholder="Search 349 manuscripts — title, shelfmark, scribe, script, date…">
    <span id="topcount"></span>
  </div>

  <div class="collate">
    <span class="cap">IMAGE</span>
    <input id="opacity" type="range" min="0" max="100" value="65" aria-label="Transcription opacity">
    <span class="cap">TEXT</span>
    <span id="opVal">65</span>
    <span class="blink">hold <kbd>space</kbd> to blink</span>
  </div>

  <div class="grp">
    <button id="boxes" aria-pressed="false">Boxes</button>
    <button id="demo">Offline preview</button>
    <button id="onlyMain" aria-pressed="false">Main text only</button>
    <button id="invert" aria-pressed="false">Light ink</button>
  </div>
</header>

<main>
  <div id="osd"></div>
  <aside id="facing" aria-label="Transcription"></aside>

  <div id="browse">
    <aside id="facets"></aside>
    <div id="results">
      <div class="rhead">
        <input id="q" type="text" placeholder="title, shelfmark, scribe, date…" spellcheck="false">
        <span id="rcount">—</span>
        <button id="clearF">Clear filters</button>
      </div>
      <div id="rlist"></div>
    </div>
  </div>

  <div id="notice" role="alert">
    <h4 id="nTitle">Tiles unavailable</h4>
    <div id="nBody"></div>
    <button id="nClose">Dismiss</button>
  </div>
</main>

<footer>
  <span><span class="dot" id="statusDot"></span><span id="status">idle</span></span>
  <span>image <span class="k" id="dims">—</span></span>
  <span>lines <span class="k" id="count">0</span></span>
  <span>page <span class="k" id="srcName">—</span></span>
  <span>image <span class="k" id="imgSrc">—</span></span>
  <span>scale <span class="k" id="scaleF">1.000</span></span>
</footer>

<script>
/* =====================================================================
   BnF Hebrew manuscript viewer — transcription overlay + facing text
   ---------------------------------------------------------------------
   Data model: everything downstream renders from ONE array, `lines`.
     line = { id, x, y, w, h, text, conf }
   with x/y/w/h in ORIGINAL IMAGE PIXELS of the IIIF "full" image.
   Overlay mode and facing mode are two renderers over that array.
   ===================================================================== */

const TEXT_FILL = 0.72;   // font-size as a fraction of box height. See note (2) below.

let viewer = null;
let lines = [];           // the single source of truth
let overlays = [];        // { line, el, span, k }  k = fixed horizontal scale
let imgW = 0, imgH = 0;
let srcLabel = "placeholder text";
let flatFallbackUsed = false;
let openTimer = null;
let demoMode = false;

/* ---------------------------------------------------------------------
   1. PLACEHOLDER LINES
   Normalised 0–1 boxes so they land sensibly whatever the real pixel
   dimensions turn out to be. Replace by loading a PAGE XML file.
   Text: Genesis 1 (public domain).
--------------------------------------------------------------------- */
const PLACEHOLDER_TEXT = [
  "בְּרֵאשִׁית בָּרָא אֱלֹהִים אֵת הַשָּׁמַיִם וְאֵת הָאָרֶץ",
  "וְהָאָרֶץ הָיְתָה תֹהוּ וָבֹהוּ וְחֹשֶׁךְ עַל פְּנֵי תְהוֹם",
  "וְרוּחַ אֱלֹהִים מְרַחֶפֶת עַל פְּנֵי הַמָּיִם",
  "וַיֹּאמֶר אֱלֹהִים יְהִי אוֹר וַיְהִי אוֹר",
  "וַיַּרְא אֱלֹהִים אֶת הָאוֹר כִּי טוֹב",
  "וַיַּבְדֵּל אֱלֹהִים בֵּין הָאוֹר וּבֵין הַחֹשֶׁךְ",
  "וַיִּקְרָא אֱלֹהִים לָאוֹר יוֹם וְלַחֹשֶׁךְ קָרָא לָיְלָה",
  "וַיְהִי עֶרֶב וַיְהִי בֹקֶר יוֹם אֶחָד",
  "וַיֹּאמֶר אֱלֹהִים יְהִי רָקִיעַ בְּתוֹךְ הַמָּיִם",
  "וִיהִי מַבְדִּיל בֵּין מַיִם לָמָיִם",
  "וַיַּעַשׂ אֱלֹהִים אֶת הָרָקִיעַ וַיַּבְדֵּל בֵּין הַמַּיִם",
  "אֲשֶׁר מִתַּחַת לָרָקִיעַ וּבֵין הַמַּיִם אֲשֶׁר מֵעַל",
  "לָרָקִיעַ וַיְהִי כֵן וַיִּקְרָא אֱלֹהִים לָרָקִיעַ שָׁמָיִם",
  "וַיְהִי עֶרֶב וַיְהִי בֹקֶר יוֹם שֵׁנִי",
  "וַיֹּאמֶר אֱלֹהִים יִקָּווּ הַמַּיִם מִתַּחַת הַשָּׁמַיִם"
];

function placeholderLines(W, H){
  // A plausible single text block: right margin 0.14, block width 0.70.
  const top = 0.115, bottom = 0.90, x0 = 0.16, wFrac = 0.68;
  const n = PLACEHOLDER_TEXT.length;
  const pitch = (bottom - top) / n;
  return PLACEHOLDER_TEXT.map((t,i)=>({
    id: "ph_" + (i+1),
    x: Math.round(x0 * W),
    y: Math.round((top + i*pitch) * H),
    w: Math.round(wFrac * W),
    h: Math.round(pitch * 0.78 * H),
    text: t,
    conf: null
  }));
}

/* ---------------------------------------------------------------------
   2. VIEWER
--------------------------------------------------------------------- */
function setStatus(msg, kind){
  document.getElementById('status').textContent = msg;
  const d = document.getElementById('statusDot');
  d.className = 'dot' + (kind ? ' ' + kind : '');
}

function notice(title, body){
  document.getElementById('nTitle').textContent = title;
  document.getElementById('nBody').innerHTML = body;
  document.getElementById('notice').classList.add('show');
}
document.getElementById('nClose').onclick = ()=>{
  document.getElementById('notice').classList.remove('show');
  // If nothing is on the stage, go back to where the reader came from rather
  // than leaving them looking at an empty frame.
  if (!viewer || !viewer.world || !viewer.world.getItemCount()){
    if (corpus.length) document.body.classList.add('browsing');
  }
};

function onOpen(){
  clearTimeout(openTimer);
  const src = viewer.world.getItemAt(0).source;
  imgW = src.width; imgH = src.height;
  document.getElementById('dims').textContent = imgW + " \u00d7 " + imgH;

  if (pendingLines){
    // The ALTO records the dimensions of the image it was run on. If the JPEG
    // here is a different size, every coordinate is off by a constant factor
    // -- same page, different ruler. Rescale rather than assume.
    let s = 1;
    if (pendingDeclared && pendingDeclared.w > 0){
      s = imgW / pendingDeclared.w;
      const sy = pendingDeclared.h > 0 ? imgH / pendingDeclared.h : s;
      if (Math.abs(sy - s) / s > 0.02){
        notice('Image proportions differ from the transcription',
          `The transcription was made on an image ${pendingDeclared.w}\u00d7${pendingDeclared.h},
           but this one is ${imgW}\u00d7${imgH}. Lines were scaled on width, so they may drift
           down the page.`);
      }
    }
    document.getElementById('scaleF').textContent = s.toFixed(3);
    lines = (Math.abs(s-1) < 1e-6) ? pendingLines
          : pendingLines.map(l=>({...l, x:l.x*s, y:l.y*s, w:l.w*s, h:l.h*s}));
    pendingLines = null; pendingDeclared = null;
    setStatus(lines.length + ' lines \u2014 ' + imageMode, 'ok');
  } else {
    setStatus(demoMode ? 'offline preview \u2014 synthetic page'
            : flatFallbackUsed ? 'flat image (no tiles)' : 'tiles loaded', 'ok');
    if (!lines.length || lines[0].id.startsWith('ph_')){
      lines = placeholderLines(imgW, imgH);
      srcLabel = 'placeholder text';
    }
  }
  render();
}

/* ---------------------------------------------------------------------
   OFFLINE PREVIEW
   Draws a synthetic ruled page on a canvas — no network at all — so the
   overlay geometry, the blink, and the facing sync can be exercised even
   where gallica.bnf.fr is unreachable. This is scaffolding, not a facsimile.
--------------------------------------------------------------------- */
function syntheticPage(W, H){
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const g = c.getContext('2d');

  g.fillStyle = '#d9c8a4'; g.fillRect(0,0,W,H);
  // uneven tone, so the opacity slider has something to reveal
  for (let i=0;i<220;i++){
    const r = 40 + Math.random()*260;
    g.beginPath();
    g.arc(Math.random()*W, Math.random()*H, r, 0, Math.PI*2);
    g.fillStyle = `rgba(${150+Math.random()*60|0},${120+Math.random()*50|0},80,0.035)`;
    g.fill();
  }
  // ruling and a written area matching the placeholder block
  const top=0.115, bottom=0.90, x0=0.16, wF=0.68, n=PLACEHOLDER_TEXT.length;
  const pitch=(bottom-top)/n;
  g.strokeStyle='rgba(120,95,60,0.28)'; g.lineWidth=1.5;
  for(let i=0;i<=n;i++){
    const y=(top+i*pitch)*H;
    g.beginPath(); g.moveTo(x0*W, y); g.lineTo((x0+wF)*W, y); g.stroke();
  }
  // ink strokes, deliberately offset a few px from the ruling so the
  // blink test has something honest to reveal
  g.fillStyle='rgba(45,32,22,0.82)';
  for(let i=0;i<n;i++){
    const y=(top+i*pitch)*H + pitch*H*0.22;
    const h=pitch*H*0.42;
    let x=(x0+wF)*W;
    while (x > x0*W + Math.random()*140){
      const w = 8 + Math.random()*26;
      g.fillRect(x-w, y + Math.random()*4, w, h*(0.55+Math.random()*0.45));
      x -= w + 6 + Math.random()*10;
    }
  }
  return c.toDataURL('image/jpeg', 0.82);
}

function openDemo(){
  clearTimeout(openTimer);
  document.getElementById('notice').classList.remove('show');
  demoMode = true; flatFallbackUsed = true;
  resetToPlaceholder();
  if (viewer){ viewer.destroy(); viewer = null; }
  viewer = OpenSeadragon({
    id:'osd', showNavigationControl:false, showNavigator:true,
    navigatorPosition:'BOTTOM_LEFT', navigatorHeight:90, navigatorWidth:70,
    maxZoomPixelRatio:3, animationTime:0.5, springStiffness:8,
    tileSources:{ type:'image', url: syntheticPage(1400,1900), buildPyramid:false }
  });
  viewer.addHandler('open', onOpen);
  viewer.addHandler('update-viewport', scaleOverlayText);
}
document.getElementById('demo').onclick = openDemo;


/* ---------------------------------------------------------------------
   3. OVERLAY RENDERING
   Font-size must track zoom. Two facts make this cheap:
     - OSD sets the overlay div's pixel height every frame, so
       fontSize = clientHeight * TEXT_FILL is one style write per line.
     - The horizontal scale factor k = boxWidth / naturalTextWidth is
       CONSTANT across zoom (both terms scale together), so it is
       measured once at load and never recomputed.
--------------------------------------------------------------------- */
function clearOverlays(){
  if (viewer) viewer.clearOverlays();
  overlays = [];
}

let mainOnly = false;
function visibleLines(){ return mainOnly ? lines.filter(l=>l.main!==false) : lines; }

function render(){
  clearOverlays();
  renderOverlay();
  renderFacing();
  document.getElementById('count').textContent = visibleLines().length
      + (mainOnly && visibleLines().length !== lines.length ? ' / ' + lines.length : '');
  document.getElementById('srcName').textContent = srcLabel;
  const im = document.getElementById('imgSrc');
  if (im) im.textContent = imageMode;
  applyOpacity();
}

function renderOverlay(){
  if (!viewer || !viewer.world.getItemCount()) return;

  // offscreen ruler for measuring natural text width once per line
  const ruler = document.createElement('div');
  ruler.style.cssText = 'position:absolute;visibility:hidden;white-space:nowrap;left:-9999px;top:0;';
  ruler.style.fontFamily = getComputedStyle(document.documentElement).getPropertyValue('--hebrew');
  document.body.appendChild(ruler);

  visibleLines().forEach((ln, i)=>{
    const el = document.createElement('div');
    el.className = 'oline';
    if (ln.conf !== null && ln.conf < 0.75) el.classList.add('low');
    el.dataset.i = i;

    const span = document.createElement('span');
    span.textContent = ln.text;
    el.appendChild(span);

    // measure at a reference font size, then derive the fixed x-scale
    const refFont = 100;
    ruler.style.fontSize = refFont + 'px';
    ruler.textContent = ln.text;
    const naturalAtRef = ruler.offsetWidth || 1;
    const fontAtImageScale = ln.h * TEXT_FILL;
    const naturalAtImage = naturalAtRef * (fontAtImageScale / refFont);
    let k = ln.w / naturalAtImage;
    k = Math.max(0.35, Math.min(k, 2.6));      // refuse grotesque distortion
    span.style.transform = 'scaleX(' + k.toFixed(4) + ')';

    el.addEventListener('mouseenter', ()=>hot(i, true));
    el.addEventListener('mouseleave', ()=>hot(i, false));

    viewer.addOverlay({
      element: el,
      location: viewer.viewport.imageToViewportRectangle(
        new OpenSeadragon.Rect(ln.x, ln.y, ln.w, ln.h))
    });

    overlays.push({ line: ln, el, span, k });
  });

  ruler.remove();
  scaleOverlayText();
}

function scaleOverlayText(){
  for (const o of overlays){
    const h = o.el.clientHeight;
    if (h) o.el.style.fontSize = (h * TEXT_FILL) + 'px';
  }
}

/* ---------------------------------------------------------------------
   4. FACING COLUMN — same array, different renderer
--------------------------------------------------------------------- */
function renderFacing(){
  const box = document.getElementById('facing');
  box.innerHTML = '';
  visibleLines().forEach((ln,i)=>{
    const row = document.createElement('div');
    row.className = 'fline' + (ln.conf!==null && ln.conf<0.75 ? ' low':'');
    row.dataset.i = i;
    row.innerHTML = `<div class="n">${i+1}</div><div class="t"></div>`;
    row.querySelector('.t').textContent = ln.text;
    row.addEventListener('mouseenter', ()=>{ hot(i,true); panTo(ln); });
    row.addEventListener('mouseleave', ()=>hot(i,false));
    box.appendChild(row);
  });
}

function hot(i, on){
  const o = overlays[i];
  if (o) o.el.classList.toggle('hot', on);
  const r = document.querySelector(`.fline[data-i="${i}"]`);
  if (r){
    r.classList.toggle('hot', on);
    if (on && document.body.classList.contains('mode-facing')) {
      r.scrollIntoView({block:'nearest', behavior:'smooth'});
    }
  }
}

function panTo(ln){
  if (!viewer || !viewer.world.getItemCount()) return;
  const r = viewer.viewport.imageToViewportRectangle(
    new OpenSeadragon.Rect(ln.x, ln.y, ln.w, ln.h));
  if (!viewer.viewport.getBounds().containsPoint(r.getCenter())){
    viewer.viewport.panTo(r.getCenter());
  }
}

/* ---------------------------------------------------------------------
   5. PAGE XML / JSON INGEST
   PAGE (eScriptorium / Kraken / Transkribus):
     <Page imageWidth imageHeight>
       <TextLine id><Coords points="x,y x,y …"/><TextEquiv><Unicode/>
   The imageWidth on <Page> is the image that was SEGMENTED. If that is not
   the same derivative Gallica serves as "full", every box is off by a
   constant factor — so we rescale rather than assume.
--------------------------------------------------------------------- */
function bboxFromPoints(pts){
  const xs=[], ys=[];
  pts.trim().split(/\s+/).forEach(p=>{
    const [a,b] = p.split(',').map(Number);
    if (Number.isFinite(a) && Number.isFinite(b)){ xs.push(a); ys.push(b); }
  });
  if (!xs.length) return null;
  const x=Math.min(...xs), y=Math.min(...ys);
  return { x, y, w: Math.max(...xs)-x, h: Math.max(...ys)-y };
}

function firstChildTextEquiv(node){
  for (const c of node.children){
    if (c.localName === 'TextEquiv'){
      for (const u of c.children){
        if (u.localName === 'Unicode') return (u.textContent||'').trim();
      }
    }
  }
  return '';
}

function parsePAGE(xmlText){
  const doc = new DOMParser().parseFromString(xmlText, 'application/xml');
  if (doc.querySelector('parsererror')) throw new Error('This file is not valid XML.');

  const page = doc.getElementsByTagNameNS('*','Page')[0];
  const segW = page ? parseFloat(page.getAttribute('imageWidth')) : NaN;
  const segH = page ? parseFloat(page.getAttribute('imageHeight')) : NaN;

  // one scale factor for both axes; warn if the aspect ratios disagree
  let s = 1, aspectMismatch = false;
  if (Number.isFinite(segW) && segW > 0 && imgW){
    s = imgW / segW;
    if (Number.isFinite(segH) && segH > 0){
      const sy = imgH / segH;
      if (Math.abs(sy - s) / s > 0.02) aspectMismatch = true;
    }
  }
  document.getElementById('scaleF').textContent = s.toFixed(3);

  const out = [];
  const tls = doc.getElementsByTagNameNS('*','TextLine');
  for (const tl of tls){
    let box = null;
    for (const c of tl.children){
      if (c.localName === 'Coords' && c.getAttribute('points')){
        box = bboxFromPoints(c.getAttribute('points')); break;
      }
    }
    const text = firstChildTextEquiv(tl);
    if (!box || !text) continue;
    const conf = tl.getAttribute('conf');
    out.push({
      id: tl.getAttribute('id') || ('l'+out.length),
      x: box.x*s, y: box.y*s, w: box.w*s, h: box.h*s,
      text,
      conf: conf!==null && conf!=='' ? parseFloat(conf) : null
    });
  }
  if (!out.length) throw new Error('No TextLine elements with both Coords and text were found.');
  if (aspectMismatch){
    notice('Aspect ratio mismatch',
      `The segmented image (${segW}×${segH}) has a different aspect ratio from the IIIF image
       (${imgW}×${imgH}). Boxes were scaled on width, so vertical positions may drift down the page.
       Usually this means the transcription was made from a cropped or differently-derived scan.`);
  }
  return out;
}

function parseJSON(txt){
  const j = JSON.parse(txt);
  const arr = Array.isArray(j) ? j : j.lines;
  if (!Array.isArray(arr)) throw new Error('Expected an array of lines, or { "lines": [...] }.');
  return arr.map((l,i)=>({
    id: l.id || ('l'+i),
    x:+l.x, y:+l.y, w:+l.w, h:+l.h,
    text: String(l.text||''),
    conf: (l.conf===undefined||l.conf===null) ? null : +l.conf
  })).filter(l=>Number.isFinite(l.x)&&Number.isFinite(l.h)&&l.text);
}

/* ---------------------------------------------------------------------
   FOLDER LOADING
   The converter writes one JSON per page plus a manifest, and copies the
   JPEGs into images/. Everything is local: no network, nothing to break
   in front of an audience.
--------------------------------------------------------------------- */
let bundle = [];       // [{name, jsonFile, imgFile}]
let bundleIdx = -1;

let allFiles = [];

document.getElementById('folder').addEventListener('change', async (e)=>{
  const files = Array.from(e.target.files || []);
  if (!files.length) return;
  allFiles = files;

  // A corpus folder carries an index; a single-manuscript folder does not.
  if (loadIndex(files)){
    document.body.classList.add('browsing');
    e.target.value = '';
    return;
  }

  const jsons = new Map(), imgs = new Map();
  let manifest = null;
  for (const f of files){
    const base = f.name.replace(/\.[^.]+$/, '');
    if (f.name === 'manifest.json') manifest = f;
    else if (/\.json$/i.test(f.name)) jsons.set(base, f);
    else if (/\.(jpe?g|png)$/i.test(f.name)) imgs.set(base, f);
  }

  let order = [...jsons.keys()].sort();
  if (manifest){
    try{
      const m = JSON.parse(await manifest.text());
      if (Array.isArray(m.pages)){
        const listed = m.pages.map(p=>p.id).filter(id=>jsons.has(id));
        if (listed.length) order = listed;   // manifest order wins when usable
      }
    }catch(err){ /* fall back to alphabetical */ }
  }

  if (!order.length){
    notice('No page files found',
      'That folder has no per-page JSON files in it. Point this at the output folder the converter wrote.');
    return;
  }

  bundle = order.map(id=>({ name:id, jsonFile:jsons.get(id), imgFile:imgs.get(id) || null }));
  // imgFile may be null: those pages fall back to the Gallica service in the JSON.

  const sel = document.getElementById('pagesel');
  sel.innerHTML = '';
  bundle.forEach((p,i)=>{
    const o = document.createElement('option');
    o.value = i; o.textContent = p.name;
    sel.appendChild(o);
  });

  const lab = document.getElementById('folderLabel');
  lab.classList.add('armed');
  lab.textContent = bundle.length + ' pages loaded';

  openBundlePage(0);
  e.target.value = '';
});

async function openBundlePage(i){
  if (i < 0 || i >= bundle.length) return;
  bundleIdx = i;
  document.getElementById('pagesel').value = i;
  const p = bundle[i];

  let data;
  try{
    if (p.url){
      const r = await fetch(p.url, {cache:'force-cache'});
      if (!r.ok) throw new Error('HTTP ' + r.status);
      data = await r.json();
    } else {
      data = JSON.parse(await p.jsonFile.text());
    }
    data = expandPage(data);
  }catch(err){
    notice('Could not read that page', err.message); return;
  }

  demoMode = false;
  triedFlat = false;
  gallicaBase = null;
  clearTimeout(openTimer);
  if (viewer){ viewer.destroy(); viewer = null; }

  pendingLines = (data.lines||[]).map((l,n)=>({
    id: l.id || ('l'+n),
    x:+l.x, y:+l.y, w:+l.w, h:+l.h,
    text: String(l.text||''),
    conf: (l.conf===undefined||l.conf===null) ? null : +l.conf,
    main: l.main !== false
  })).filter(l=>Number.isFinite(l.x) && Number.isFinite(l.h) && l.text);

  pendingDeclared = { w: +data.width || 0, h: +data.height || 0 };
  srcLabel = data.folio ? (p.name + '  (f. ' + data.folio + ')') : p.name;

  // A local copy always wins: BnF rate-limits its IIIF server, so anything
  // shown live should not depend on a network round trip.
  let tileSources, mode;
  if (p.imgFile){
    tileSources = { type:'image', url: URL.createObjectURL(p.imgFile), buildPyramid:false };
    mode = 'local copy';
  } else if (data.iiif && data.iiif.indexOf('/None/') === -1){
    tileSources = data.iiif + '/info.json';
    mode = 'gallica';
    gallicaBase = data.iiif;
  } else if (data.iiif){
    notice('This page has no Gallica address',
      'Its address reads <code>' + data.iiif + '</code> \u2014 the manuscript identifier is '
      + 'missing, so there is nothing to fetch. This folder was built before the Gallica '
      + 'mapping existed. Rebuild it with <code>build_corpus.py</code>, or pass '
      + '<code>--mapping</code> to the converter.');
    setStatus('no image address', 'bad');
    return;
  } else {
    notice('No image for this page',
      `Neither a local copy nor a Gallica address is recorded for <code>${p.name}</code>.
       Re-run the converter with <code>--mapping</code>, or with <code>--copy-images</code>.`);
    return;
  }

  setStatus('loading image (' + mode + ')\u2026');
  viewer = OpenSeadragon({
    id:'osd', showNavigationControl:false, showNavigator:true,
    navigatorPosition:'BOTTOM_LEFT', navigatorHeight:90, navigatorWidth:70,
    maxZoomPixelRatio:3, animationTime:0.5, springStiffness:8,
    imageLoaderLimit: mode==='gallica' ? 2 : 4,   // be gentle with Gallica
    tileSources
  });
  imageMode = mode;

  viewer.addHandler('open', onOpen);
  viewer.addHandler('open-failed', onRemoteFailed);
  viewer.addHandler('update-viewport', scaleOverlayText);

  if (mode === 'gallica'){
    clearTimeout(openTimer);
    openTimer = setTimeout(()=>{
      if (!viewer || !viewer.world.getItemCount()) onRemoteFailed();
    }, 15000);
  }
}

function onRemoteFailed(){
  clearTimeout(openTimer);

  // The tiled service needs a cross-origin fetch of info.json, which browsers
  // refuse when the page itself was opened from a file. A plain JPEG is an
  // image load rather than a fetch, so it still works: lower resolution, same
  // geometry, and the overlay is unaffected because coordinates are rescaled.
  if (gallicaBase && !triedFlat){
    triedFlat = true;
    imageMode = 'gallica (flat)';
    setStatus('tiles unavailable \u2014 loading flat image\u2026');
    if (viewer){ viewer.destroy(); viewer = null; }
    viewer = OpenSeadragon({
      id:'osd', showNavigationControl:false, showNavigator:true,
      navigatorPosition:'BOTTOM_LEFT', navigatorHeight:90, navigatorWidth:70,
      maxZoomPixelRatio:3, animationTime:0.5, springStiffness:8,
      tileSources:{ type:'image', url: gallicaBase + '/full/2000,/0/native.jpg',
                    buildPyramid:false },
      crossOriginPolicy: false
    });
    viewer.addHandler('open', onOpen);
    viewer.addHandler('open-failed', onRemoteFailed);
    viewer.addHandler('update-viewport', scaleOverlayText);
    clearTimeout(openTimer);
    openTimer = setTimeout(()=>{
      if (!viewer || !viewer.world.getItemCount()) onRemoteFailed();
    }, 20000);
    return;
  }

  setStatus('Gallica did not respond', 'bad');
  if (corpus.length) document.body.classList.add('browsing');
  notice('Gallica did not return this image',
    'Neither the tiled service nor the flat image loaded.<br><br>'
    + 'BnF limits how quickly its image server may be called, so this can happen '
    + 'when several pages are opened in a row \u2014 waiting a moment usually works. '
    + 'If it persists, serving this file over <code>http://</code> rather than opening '
    + 'it directly (<code>python3 -m http.server</code>) removes a browser restriction '
    + 'that blocks the tiled service.');
}

let imageMode = 'local copy';
let gallicaBase = null;
let triedFlat = false;

let pendingLines = null, pendingDeclared = null;

/* The published files use short keys and positional line arrays, which takes
   roughly half the bytes off a corpus of this size. Expand on arrival so the
   rest of the viewer needs to know nothing about it. */
function expandPage(d){
  if (!d || !Array.isArray(d.l)) return d;      // already the long form
  return {
    id: d.i, page: d.p, folio: d.f,
    iiif: d.u || null, image: d.c || null,
    width: d.w, height: d.h,
    lines: d.l.map((a,n)=>({
      id: 'l' + n,
      x: a[0], y: a[1], w: a[2], h: a[3],
      main: a[4] === 1,
      conf: a[5] === null ? null : a[5],
      text: a[6]
    }))
  };
}

document.getElementById('pagesel').addEventListener('change', e=>openBundlePage(+e.target.value));


/* ---------------------------------------------------------------------
   BROWSE: metadata search over the whole corpus
   index-meta.json is small (about 1 MB for the full set), so the catalogue
   can be searched entirely in the page. The transcribed text is far too
   large for that and is fetched per manuscript instead.
--------------------------------------------------------------------- */
let corpus = [];            // manuscript records from index-meta.json
let facets = {};
let active = {};            // facet -> Set of chosen values
let corpusFolder = null;    // the picked directory, for opening a manuscript

const NIQQUD = /[\u0591-\u05C7]/g;
function fold(s){
  if (!s) return '';
  return s.normalize('NFKD').replace(NIQQUD,'')
          .replace(/[\u05DA\u05DD\u05DF\u05E3\u05E5]/g, c=>
            ({'\u05DA':'\u05DB','\u05DD':'\u05DE','\u05DF':'\u05E0',
              '\u05E3':'\u05E4','\u05E5':'\u05E6'}[c]))
          .replace(/[^\u05D0-\u05EA\w\s]/g,' ')
          .replace(/\s+/g,' ').trim().toLowerCase();
}

function loadIndex(files){
  const meta = files.find(f=>f.name==='index-meta.json');
  if (!meta) return false;
  meta.text().then(t=>{
    const d = JSON.parse(t);
    corpus = (d.manuscripts || []).map(m => {
      const parts = String(m.id||'').split('_');
      return Object.assign({}, m, { ie: parts.length > 1 ? parts.pop() : null });
    });
    facets = d.facets || {};
    buildFacets();
    runSearch();
    document.getElementById('browseBtn').textContent =
      'Browse ' + corpus.length + ' manuscripts';
  }).catch(e=>notice('Could not read the index', e.message));
  return true;
}

function buildFacets(){
  const box = document.getElementById('facets');
  box.innerHTML = '';
  const labels = {script:'Script', language:'Language', genre:'Genre', subject:'Subject'};
  for (const key of ['script','language','genre','subject']){
    const vals = facets[key] || [];
    if (!vals.length) continue;
    const h = document.createElement('h4');
    h.textContent = labels[key];
    box.appendChild(h);
    vals.slice(0,25).forEach(([v,n])=>{
      const el = document.createElement('div');
      el.className = 'fv';
      el.innerHTML = '<span></span><span class="c">' + n + '</span>';
      el.firstChild.textContent = v;
      el.onclick = ()=>{
        active[key] = active[key] || new Set();
        active[key].has(v) ? active[key].delete(v) : active[key].add(v);
        el.classList.toggle('on');
        runSearch();
      };
      box.appendChild(el);
    });
  }
}

function matches(m, terms){
  for (const k in active){
    if (!active[k] || !active[k].size) continue;
    const v = String(m[k]||'');
    let hit = false;
    for (const want of active[k]) if (v.split(/\s*;\s*/).includes(want)) hit = true;
    if (!hit) return false;
  }
  if (!terms.length) return true;
  const blob = m._f || fold([m.title,m.shelfmark,m.persons,m.date,m.genre,
                             m.subject,m.script,m.language].join(' '));
  return terms.every(t=>blob.includes(t));
}

function runSearch(){
  const q = document.getElementById('q').value.trim();
  const terms = fold(q).split(' ').filter(Boolean);
  const hits = corpus.filter(m=>matches(m, terms));

  const label = hits.length + ' of ' + corpus.length;
  document.getElementById('rcount').textContent = label;
  const tc = document.getElementById('topcount');
  if (tc) tc.textContent = (document.getElementById('topq').value.trim() ||
                            Object.keys(active).some(k=>active[k] && active[k].size))
                            ? label : '';

  const list = document.getElementById('rlist');
  list.innerHTML = '';
  if (!hits.length){
    list.innerHTML = '<div class="empty">Nothing matches those filters.</div>';
    return;
  }
  hits.slice(0,400).forEach(m=>{
    const row = document.createElement('div');
    row.className = 'ms';

    const sh = document.createElement('div');
    sh.className = 'sh'; sh.textContent = m.shelfmark || m.alma;

    const mid = document.createElement('div');
    const ti = document.createElement('div');
    ti.className = /[\u05D0-\u05EA]/.test(m.title||'') ? 'ti' : 'lat';
    ti.textContent = m.title || '(untitled)';
    mid.appendChild(ti);
    const tags = [m.script, m.genre, m.persons].filter(Boolean).join(' \u00b7 ');
    if (tags){
      const t = document.createElement('div');
      t.className = 'tags'; t.textContent = tags.slice(0,110);
      mid.appendChild(t);
    }

    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.textContent = [m.year || m.date || '', (m.n_pages||0) + ' pp']
                        .filter(Boolean).join('\n');
    meta.style.whiteSpace = 'pre';

    row.append(sh, mid, meta);
    row.onclick = ()=>openManuscript(m);
    list.appendChild(row);
  });
  if (hits.length > 400){
    const more = document.createElement('div');
    more.className = 'empty';
    more.textContent = 'Showing the first 400. Narrow the search to see the rest.';
    list.appendChild(more);
  }
}

async function openManuscript(m){
  if (webMode) return openManuscriptWeb(m);

  // local folder: the pages were handed over by the picker
  const inFolder = f => {
    const p = f.webkitRelativePath || f.name;
    return p.split('/').indexOf(m.id) !== -1;
  };
  let jsons = allFiles.filter(f =>
    /\.json$/i.test(f.name) &&
    f.name !== 'manifest.json' && f.name !== 'mapping.json' &&
    f.name !== 'pages.json' &&
    !f.name.startsWith('index-') && !f.name.startsWith('_') &&
    inFolder(f));
  if (!jsons.length && m.ie){
    jsons = allFiles.filter(f => /\.json$/i.test(f.name) && f.name.startsWith(m.ie + '_'));
  }
  if (!jsons.length){
    notice('That manuscript is not in this folder',
      'The index lists <b>' + (m.shelfmark || m.id) + '</b>, but its page files are not here.');
    return;
  }
  bundle = jsons
    .map(f => ({ name: f.name.replace(/\.json$/i,''), jsonFile: f, imgFile: null }))
    .sort((a,b)=>a.name.localeCompare(b.name));
  finishOpen(m);
}

async function openManuscriptWeb(m){
  setStatus('loading ' + (m.shelfmark || m.id) + '\u2026');
  try{
    const r = await fetch(DATA_BASE + m.id + '/pages.json', {cache:'force-cache'});
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    if (!d.pages || !d.pages.length) throw new Error('no pages listed');
    bundle = d.pages.map(p=>({
      name: p.j.replace(/\.json$/i,''),
      url: DATA_BASE + m.id + '/' + p.j,
      folio: p.f, imgFile: null
    }));
  }catch(err){
    notice('Could not open that manuscript',
      'The catalogue lists <b>' + (m.shelfmark || m.id) + '</b>, but its pages could not be '
      + 'fetched (' + err.message + '). It may not have been published yet.');
    setStatus('could not open', 'bad');
    return;
  }
  finishOpen(m);
}

function finishOpen(m){
  const sel = document.getElementById('pagesel');
  sel.innerHTML = '';
  bundle.forEach((p,i)=>{
    const o = document.createElement('option');
    o.value = i;
    o.textContent = p.folio ? ('f. ' + p.folio) : p.name;
    sel.appendChild(o);
  });
  const lab = document.getElementById('folderLabel');
  lab.classList.add('armed');
  lab.textContent = (m.shelfmark || m.id) + ' \u2014 ' + bundle.length + ' pages';
  document.body.classList.remove('browsing');
  openBundlePage(0);
}

document.getElementById('q').addEventListener('input', ()=>{
  document.getElementById('topq').value = document.getElementById('q').value;
  runSearch();
});

// The toolbar box is the one people will actually use: typing in it opens the
// list, so search is never more than a keystroke away from any page.
const topq = document.getElementById('topq');
topq.addEventListener('input', ()=>{
  document.getElementById('q').value = topq.value;
  if (!document.body.classList.contains('browsing') && corpus.length){
    document.body.classList.add('browsing');
  }
  runSearch();
});
topq.addEventListener('focus', ()=>{
  if (corpus.length) document.body.classList.add('browsing');
});
topq.addEventListener('keydown', e=>{
  if (e.key === 'Escape'){ topq.blur(); document.body.classList.remove('browsing'); }
});
document.getElementById('clearF').onclick = ()=>{
  active = {};
  document.getElementById('q').value = '';
  document.getElementById('topq').value = '';
  document.querySelectorAll('.fv.on').forEach(e=>e.classList.remove('on'));
  runSearch();
};
document.getElementById('browseBtn').onclick = ()=>{
  if (!corpus.length){
    notice('No index loaded',
      'Open a corpus folder that contains <code>index-meta.json</code>, produced by '
      + '<code>build_index.py</code>.');
    return;
  }
  document.body.classList.toggle('browsing');
};
window.addEventListener('keydown', e=>{
  if (e.key === 'Escape') document.body.classList.remove('browsing');
});

/* ---------------------------------------------------------------------
   6. THE COLLATION SLIDER
   0   = image only
   100 = text only, image ghosted to 18%
   Holding space snaps to the far end and back — a blink comparator.
   Misregistered lines jump; correctly placed ones sit still.
--------------------------------------------------------------------- */
const opInput = document.getElementById('opacity');
let blinking = false, blinkSaved = 65;

function applyOpacity(){
  const v = +opInput.value;
  document.getElementById('opVal').textContent = v;
  overlays.forEach(o=>{ o.el.style.opacity = v/100; });
  document.getElementById('osd').classList.toggle('ghost', v > 88);
  // Past the ghost threshold the page behind goes dark, so the ink has to invert.
  document.body.classList.toggle('inklight', v > 88);
}
opInput.addEventListener('input', applyOpacity);

window.addEventListener('keydown', (e)=>{
  if (e.code === 'Space' && !blinking && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)){
    e.preventDefault(); blinking = true;
    blinkSaved = +opInput.value;
    opInput.value = blinkSaved > 50 ? 0 : 100;
    applyOpacity();
  }
  if (e.key === 'ArrowLeft' && e.altKey) step(-1);
  if (e.key === 'ArrowRight' && e.altKey) step(1);
});
window.addEventListener('keyup', (e)=>{
  if (e.code === 'Space' && blinking){
    blinking = false; opInput.value = blinkSaved; applyOpacity();
  }
});

/* ---------------------------------------------------------------------
   7. MODES + NAVIGATION
--------------------------------------------------------------------- */
function setMode(m){
  document.body.classList.toggle('mode-overlay', m==='overlay');
  document.body.classList.toggle('mode-facing',  m==='facing');
  document.getElementById('mOverlay').setAttribute('aria-pressed', m==='overlay');
  document.getElementById('mFacing').setAttribute('aria-pressed',  m==='facing');
  if (viewer) setTimeout(()=>{ viewer.viewport.applyConstraints(); scaleOverlayText(); }, 200);
}
document.getElementById('mOverlay').onclick = ()=>setMode('overlay');
document.getElementById('mFacing').onclick  = ()=>setMode('facing');

const boxesBtn = document.getElementById('boxes');
boxesBtn.onclick = ()=>{
  const on = boxesBtn.getAttribute('aria-pressed') !== 'true';
  boxesBtn.setAttribute('aria-pressed', on);
  document.body.classList.toggle('boxes', on);
};

function step(d){
  if (bundle.length){ openBundlePage(Math.min(bundle.length-1, Math.max(0, bundleIdx + d))); }
}
function resetToPlaceholder(){
  lines = []; srcLabel = 'placeholder text';
  document.getElementById('scaleF').textContent = '1.000';
}
document.getElementById('prev').onclick = ()=>step(-1);
document.getElementById('next').onclick = ()=>step(1);

const invBtn = document.getElementById('invert');
invBtn.onclick = ()=>{
  const on = invBtn.getAttribute('aria-pressed') !== 'true';
  invBtn.setAttribute('aria-pressed', on);
  document.body.classList.toggle('inklight', on);
};

const mainBtn = document.getElementById('onlyMain');
mainBtn.onclick = ()=>{
  mainOnly = mainBtn.getAttribute('aria-pressed') !== 'true';
  mainBtn.setAttribute('aria-pressed', mainOnly);
  render();
};


/* ---------------------------------------------------------------------
   WEB MODE
   Served from a site, the corpus sits beside this file rather than being
   handed over by a folder picker. Load the catalogue at startup and fetch
   each manuscript's pages when the reader opens it. Falling back to the
   picker keeps the file usable offline, which is what a presentation wants.
--------------------------------------------------------------------- */
const DATA_BASE = 'data/';          // where the corpus was published
let webMode = false;

async function bootFromServer(){
  try{
    const r = await fetch(DATA_BASE + 'index-meta.json', {cache:'force-cache'});
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    corpus = (d.manuscripts || []).map(m=>{
      const parts = String(m.id||'').split('_');
      return Object.assign({}, m, { ie: parts.length>1 ? parts.pop() : null });
    });
    facets = d.facets || {};
    webMode = true;
    buildFacets();
    runSearch();
    document.getElementById('browseBtn').textContent =
      'Browse ' + corpus.length + ' manuscripts';
    topq.placeholder = 'Search ' + corpus.length
      + ' manuscripts \u2014 title, shelfmark, scribe, script, date\u2026';
    document.body.classList.add('browsing');
    setStatus(corpus.length + ' manuscripts', 'ok');
    return true;
  }catch(err){
    return false;
  }
}

bootFromServer().then(ok=>{ if (!ok) openDemo(); });
</script>
